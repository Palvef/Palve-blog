sections:
  - heading: "工作与实习经历"
    items:
      - title: "安恒信息 (DBAPPSecurity)"
        period: "2025.12 – 2026.07"
        subtitle: "安全研发与工程实践"
        bullets:
          - "参与安全工程研发与实战化平台建设，涵盖 AI 多智能体驱动的网络安全渗透工具及基于 Flink 算子的大数据中台（Kafka、Elasticsearch、ClickHouse 等）相关实践。"
      - title: "奇安信科技集团股份有限公司 (QiAnXin)"
        period: "2024.12 – 2025.09"
        subtitle: "安全工程师 — 渗透测试 · 安全监测 · 安全运维"
        bullets:
          - "为客户提供驻场技术支持，负责客户侧业务环境网络安全保障。"
          - "负责网络安全设备升级维护与漏洞复测，开展内部漏洞扫描、统计分析与报告输出。"
          - "监控并上报 EDR 资产状态及安全风险漏洞，按月编制客户安全运维工作报告。"
          - "参与红蓝对抗演练、春耕行动、HW 护网行动、企业攻防演练及重大活动重保任务。"
      - title: "南阳市网络安全监测预警中心"
        period: "2022.09 – 2026.06"
        subtitle: "渗透测试 · 安全监测"
        bullets:
          - "面向南阳市重点企业与教育机构开展网络安全渗透测试与风险评估。"
          - "编写漏洞分析报告并提供可落地的修复加固方案，持续监测各单位安全态势。"

  - heading: "核心基础设施与工程项目"
    items:
      - title: "河南省教育科研网 & 南阳理工学院开源软件镜像站"
        url: "https://mirrors.ha.edu.cn"
        period: "2023 – 至今"
        subtitle: "`mirror(s).{nyist,ha}.edu.cn` · 同步工具 [synora](https://github.com/Palvef/synora) · 前端 [ha-mirrors-web](https://github.com/hernet-mirrors/ha-mirrors-web)"
        bullets:
          - "**synora 与新前端上线**：两站现已全面上线基于 Rust 编写的镜像同步工具 [synora](https://github.com/Palvef/synora) 与前端项目 [ha-mirrors-web](https://github.com/hernet-mirrors/ha-mirrors-web)。"
          - "**基于 LDAP 的镜像站基础设施建设**：搭建统一身份认证与目录服务体系，支撑镜像站多节点与内部服务权限治理。"
          - "**基于 LuaJIT 的 NGINX 镜像防盗刷机制**：结合 OpenResty / LuaJIT 在边缘代理层实现高精度并发控制、异常特征识别与动态防盗刷策略。"
          - "**镜像日志分析体系演进**：完整推进 **ELK 镜像日志建设（2023–2026）** 及向 **ClickHouse 日志中心分析（2026–至今）** 的架构升级，实现海量镜像访问日志的实时入库与多维分析（详见 [os.nju.edu.cn](https://os.nju.edu.cn)）。"
          - "**ZFS 生产设施最佳实践**：围绕镜像站海量小文件与高吞吐同步场景，落地 ZFS 存储池布局、ARC/L2ARC 调优、压缩策略、快照与故障恢复实践。"
          - "**NGINX njs rsync 排队机制**：为 `ngx_stream_js_module` 补丁支持 `preread` 阶段发包，实现多 worker 共享的严格 FIFO 排队与实时 MOTD 反馈。"
      - title: "私有云、虚拟化与校内研发平台"
        bullets:
          - "**OpenStack 本地化集群部署与生产运营**：独立完成 OpenStack 本地化集群部署并投入生产，目前已稳定承载 **17 台生产业务**。"
          - "**校内代码托管与 CI/CD 全流程部署**：从零建设校内 Git 代码托管平台与自动化构建、测试、镜像打包及发布流水线。"
          - "**社团 Proxmox VE (PVE) 集群搭建**：规划并搭建高可用 PVE 虚拟化集群，支撑社团教学实验、靶场与多业务隔离运行。"
      - title: "DNS、分布式网络与可观测性"
        bullets:
          - "**自研递归 / 权威 DNS**：设计并实现具备解析调度与缓存控制能力的递归与权威 DNS 服务。"
          - "**基于 Agent 注册的递归 DNS 拨测**：构建分布式 Agent 自动注册与心跳调度体系，实现对各地递归 DNS 解析延迟、正确性与劫持状态的持续拨测。"
          - "**分布式网络组网**：落地跨地域节点互联、路由规划、VLAN 隔离与加密隧道组网方案。"
      - title: "安全智能体与大数据中台"
        bullets:
          - "**AI 多智能体驱动的网络安全渗透工具**：构建多 Agent 协同的自动化信息收集、攻击面分析与渗透验证工作流。"
          - "**基于 Flink 算子的大数据中台**：基于 Apache Flink 自定义算子，串联 **Kafka、Elasticsearch (ES)、ClickHouse (CK)** 等组件，实现高吞吐日志清洗、实时规则关联与分析入库。"

  - heading: "技术栈"
    items:
      - title: "编程语言与脚本"
        description: "Python、C、C++、Go、Rust、**Lua / LuaJIT**、JavaScript (njs)、Shell。"
      - title: "基础设施与存储网络"
        description: "Linux 系统管理、OpenStack、Proxmox VE (PVE)、ZFS、Docker、Kubernetes、LDAP、自研 DNS、分布式组网、VLAN / 路由 / 防火墙与系统安全加固、CI/CD 全流程运维。"
      - title: "大数据与可观测性"
        description: "Apache Flink、Kafka、Elasticsearch (ELK)、ClickHouse (CK)、Zabbix、Prometheus、InfluxDB、Grafana、Syslog 与应用日志分析。"
      - title: "网络安全与攻防"
        description: "Web 安全与漏洞利用链（SQL 注入、XSS、提权、CSRF、文件上传、命令执行）、AI 多智能体自动化渗透、HW 红蓝对抗、中间件安全（Nginx/Apache/IIS）；熟练使用 Kali Linux、Metasploit、Cobalt Strike、Burp Suite、Nmap、Sqlmap、AWVS、Wireshark、Fortify、Seay。"

  - heading: "荣誉奖项"
    items:
      - title: "教育信息技术应用创新大赛（「软件适配迁移赛」一类）— 特等奖"
        period: "2024.12"
        bullets:
          - "华中及华南赛区一等奖"
          - "优秀个人贡献奖"
      - title: "河南省教育数字化创新应用大赛（个人组）— 二等奖"
        period: "2024.07"
