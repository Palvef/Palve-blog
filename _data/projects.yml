zh:
  - name: "河南省教育科研网 & 南阳理工学院开源软件镜像站"
    url: "https://mirrors.ha.edu.cn"
    summary: "mirror(s).{nyist,ha}.edu.cn，现已上线 Rust 同步工具 synora 与前端 ha-mirrors-web；涵盖 LDAP 基础设施、LuaJIT + NGINX 防盗刷、ZFS 生产实践及 ELK (2023–2026) → ClickHouse (2026–至今) 日志分析中心（详见 os.nju.edu.cn）。"
  - name: "OpenStack 本地化私有云集群"
    summary: "独立完成本地化 OpenStack 集群部署并投入生产运行，目前已稳定承载 17 台生产业务。"
  - name: "NGINX njs Stream 协议层 rsync 排队系统"
    url: "https://github.com/Palvef/njs/tree/stream-send-in-preread"
    summary: "通过扩展 ngx_stream_js_module 支持 preread 阶段向客户端发包，基于共享字典实现按上游隔离的严格 FIFO 排队与实时 MOTD 提示。"
  - name: "自研递归/权威 DNS 与分布式拨测"
    summary: "自研递归与权威 DNS 服务，结合基于 Agent 注册机制的递归 DNS 拨测平台与分布式组网架构。"
  - name: "AI 多智能体网络安全渗透工具"
    summary: "基于多智能体协同架构驱动的自动化渗透测试、信息收集与漏洞利用验证工具链。"
  - name: "基于 Flink 算子的大数据安全中台"
    summary: "整合 Apache Flink、Kafka、Elasticsearch 与 ClickHouse 的实时流批处理与安全日志分析中台。"

en:
  - name: "HERNET & NYIST Open Source Software Mirrors"
    url: "https://mirrors.ha.edu.cn"
    summary: "mirror(s).{nyist,ha}.edu.cn powered by the Rust sync tool synora and ha-mirrors-web frontend, with LDAP infrastructure, LuaJIT NGINX anti-scraping, production ZFS, and ELK (2023–2026) → ClickHouse (2026–present) log analytics (os.nju.edu.cn)."
  - name: "On-Premises OpenStack Cloud Cluster"
    summary: "End-to-end deployment and operation of a localized OpenStack cluster currently running 17 production workloads."
  - name: "NGINX njs Stream rsync Connection Queue"
    url: "https://github.com/Palvef/njs/tree/stream-send-in-preread"
    summary: "Extended ngx_stream_js_module to permit sending downstream data in js_preread, enabling a shared-dictionary FIFO rsync queue with live MOTD updates."
  - name: "Custom Recursive/Authoritative DNS & Agent-Based Probing"
    summary: "In-house recursive and authoritative DNS implementation paired with an agent-registered DNS probing system and distributed overlay networking."
  - name: "AI Multi-Agent Penetration Testing Tool"
    summary: "Automated cybersecurity reconnaissance and penetration testing workflow driven by collaborative AI agents."
  - name: "Flink Operator-Based Big Data Platform"
    summary: "Real-time data and security analytics platform built on Apache Flink custom operators, Kafka, Elasticsearch, and ClickHouse."
