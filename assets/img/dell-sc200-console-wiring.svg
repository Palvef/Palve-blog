<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .title { font-size: 15px; font-weight: 700; fill: #111827; }
      .sub { font-size: 12px; fill: #4b5563; }
      .lbl { font-size: 12px; font-weight: 600; fill: #111827; }
      .small { font-size: 11px; fill: #374151; }
      .pin-num { font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .pin-num-dark { font-size: 10px; font-weight: 600; fill: #6b7280; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="860" height="360" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Header -->
  <text x="430" y="28" text-anchor="middle" class="title">Dell SC200 / Storage Center 3.5mm TRS → DB9 (5-2-3) Serial Console Wiring</text>
  <text x="430" y="47" text-anchor="middle" class="sub">115200 baud · 8 data bits · No parity · 1 stop bit (115200 8N1) · No flow control</text>

  <!-- ==================== LEFT: 3.5mm TRS Plug ==================== -->
  <rect x="24" y="72" width="232" height="224" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="140" y="96" text-anchor="middle" class="lbl">3.5mm TRS Audio Plug</text>
  <text x="140" y="112" text-anchor="middle" class="small">(Controller Serial Port)</text>

  <!-- Plug Handle (Plastic Grip) -->
  <rect x="44" y="168" width="54" height="36" rx="4" fill="#374151"/>
  <rect x="98" y="175" width="12" height="22" fill="#4b5563"/>

  <!-- Sleeve (Bottom / Closest to grip) -->
  <rect x="110" y="178" width="46" height="16" fill="#d1d5db" stroke="#6b7280" stroke-width="1"/>
  <!-- Insulator 1 -->
  <rect x="156" y="178" width="6" height="16" fill="#111827"/>
  <!-- Ring (Middle) -->
  <rect x="162" y="178" width="32" height="16" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
  <!-- Insulator 2 -->
  <rect x="194" y="178" width="6" height="16" fill="#111827"/>
  <!-- Tip (Top) -->
  <path d="M 200 178 L 222 178 L 232 183 L 232 189 L 222 194 L 200 194 Z" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>

  <!-- Segment Callouts -->
  <!-- Sleeve callout -->
  <line x1="133" y1="178" x2="133" y2="140" stroke="#111827" stroke-width="1.5"/>
  <circle cx="133" cy="186" r="3" fill="#111827"/>
  <text x="133" y="133" text-anchor="middle" class="lbl">Sleeve (底段)</text>

  <!-- Ring callout -->
  <line x1="178" y1="194" x2="178" y2="232" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="178" cy="186" r="3" fill="#2563eb"/>
  <text x="178" y="247" text-anchor="middle" class="lbl" fill="#1d4ed8">Ring (中段)</text>

  <!-- Tip callout -->
  <line x1="214" y1="178" x2="214" y2="152" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="214" cy="186" r="3" fill="#dc2626"/>
  <text x="214" y="146" text-anchor="middle" class="lbl" fill="#b91c1c">Tip (顶端)</text>

  <!-- 5-2-3 Badge -->
  <rect x="52" y="262" width="176" height="24" rx="4" fill="#111827"/>
  <text x="140" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Pinout Mnemonic: 5 - 2 - 3</text>

  <!-- ==================== WIRING PATHS (TRS -> DB9) ==================== -->
  <!-- Sleeve -> Pin 5 (Black / GND) -->
  <path d="M 256 132 L 320 132 L 368 132" fill="none" stroke="#111827" stroke-width="2.5"/>
  <rect x="268" y="114" width="88" height="16" rx="3" fill="#f3f4f6"/>
  <text x="312" y="126" text-anchor="middle" font-size="10.5" font-weight="600" fill="#111827">GND → Pin 5</text>

  <!-- Ring -> Pin 2 (Blue / RXD) -->
  <path d="M 256 186 L 368 186" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="268" y="168" width="88" height="16" rx="3" fill="#eff6ff"/>
  <text x="312" y="180" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d4ed8">RXD → Pin 2</text>

  <!-- Tip -> Pin 3 (Red / TXD) -->
  <path d="M 256 240 L 368 240" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <rect x="268" y="222" width="88" height="16" rx="3" fill="#fef2f2"/>
  <text x="312" y="234" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c">TXD → Pin 3</text>

  <!-- ==================== MIDDLE: DB9 Connector ==================== -->
  <rect x="368" y="72" width="236" height="224" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="486" y="96" text-anchor="middle" class="lbl">DB9 RS-232 Connector</text>
  <text x="486" y="112" text-anchor="middle" class="small">(Pin 5 / Pin 2 / Pin 3)</text>

  <!-- DB9 Trapezoid Shell -->
  <path d="M 394 134 L 578 134 L 566 210 L 406 210 Z" fill="#e5e7eb" stroke="#4b5563" stroke-width="2" stroke-linejoin="round"/>

  <!-- Top Row Pins: 1 2 3 4 5 -->
  <circle cx="422" cy="156" r="11" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="422" y="156" class="pin-num-dark">1</text>

  <circle cx="454" cy="156" r="11" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="454" y="156" class="pin-num">2</text>

  <circle cx="486" cy="156" r="11" fill="#dc2626" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="486" y="156" class="pin-num">3</text>

  <circle cx="518" cy="156" r="11" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="518" y="156" class="pin-num-dark">4</text>

  <circle cx="550" cy="156" r="11" fill="#111827" stroke="#000000" stroke-width="1.5"/>
  <text x="550" y="156" class="pin-num">5</text>

  <!-- Bottom Row Pins: 6 7 8 9 -->
  <circle cx="438" cy="188" r="11" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="438" y="188" class="pin-num-dark">6</text>

  <circle cx="470" cy="188" r="11" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="470" y="188" class="pin-num-dark">7</text>

  <circle cx="502" cy="188" r="11" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="502" y="188" class="pin-num-dark">8</text>

  <circle cx="534" cy="188" r="11" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="534" y="188" class="pin-num-dark">9</text>

  <!-- DB9 Legend inside card -->
  <text x="486" y="234" text-anchor="middle" class="small"><tspan font-weight="700" fill="#111827">Pin 5</tspan>: GND   ·   <tspan font-weight="700" fill="#1d4ed8">Pin 2</tspan>: RXD   ·   <tspan font-weight="700" fill="#b91c1c">Pin 3</tspan>: TXD</text>
  <text x="486" y="254" text-anchor="middle" font-size="10.5" fill="#6b7280">No output? Try swapping Pin 2 &amp; Pin 3</text>
  <text x="486" y="270" text-anchor="middle" font-size="10.5" fill="#6b7280">(无回显时互换 2 / 3 脚即可)</text>

  <!-- ==================== RIGHT: MAX3232 -> USB-TTL -> PC ==================== -->
  <line x1="604" y1="184" x2="646" y2="184" stroke="#4b5563" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="644,179 654,184 644,189" fill="#4b5563"/>

  <rect x="656" y="72" width="180" height="224" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="746" y="96" text-anchor="middle" class="lbl">RS-232 ↔ TTL Adapter</text>
  <text x="746" y="112" text-anchor="middle" class="small">(MAX3232 + USB-TTL)</text>

  <!-- MAX3232 Mini Board -->
  <rect x="684" y="130" width="124" height="58" rx="5" fill="#1e3a8a" stroke="#1e40af" stroke-width="1.2"/>
  <circle cx="702" cy="144" r="4" fill="#ef4444"/>
  <text x="746" y="154" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">MAX3232</text>
  <text x="746" y="172" text-anchor="middle" font-size="10" fill="#bfdbfe">VCC · RXD · TXD · GND</text>

  <!-- Arrow down to PC -->
  <line x1="746" y1="188" x2="746" y2="218" stroke="#4b5563" stroke-width="2"/>
  <polygon points="741,216 746,225 751,216" fill="#4b5563"/>

  <!-- Host PC Box -->
  <rect x="684" y="228" width="124" height="50" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
  <text x="746" y="249" text-anchor="middle" class="lbl">Host Serial Terminal</text>
  <text x="746" y="266" text-anchor="middle" class="small">minicom / screen / PuTTY</text>

  <!-- Footer Note -->
  <text x="430" y="330" text-anchor="middle" font-size="11.5" fill="#4b5563">Note: Controller 3.5mm console uses RS-232 voltage levels; use a MAX3232 level shifter if connecting via USB-TTL.</text>
</svg>
