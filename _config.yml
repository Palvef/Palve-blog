url: "https://blog.palve.moe"
baseurl: ""
title: "Palve"
subtitle: "System, Network & Security Notes"
subtitle_zh: "系统、网络与安全笔记"
description: "Palve's Blog"
repository: "Palvef/Palve-blog"
homepage_url: "https://www.palve.moe"
google_analytics: "G-Y7KVPN8R2K"

lang: zh-CN
timezone: "Asia/Shanghai"
permalink: /:year/:month/:slug/
excerpt_separator: "\n\n"

# Browser SHA-256 Proof-of-Work encrypted contact payload (no plaintext email in HTML/JS)
email_pow:
  salt: "palve-pow-2026-2009d04467e3"
  difficulty: 18
  ct: "e3258a7cc069a6f2931eebac7279"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE.md
  - vendor
  - node_modules
  - tmp

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "_posts/zh"
    values:
      layout: post
      lang: zh
  - scope:
      path: "_posts/en"
    values:
      layout: post
      lang: en
  - scope:
      path: "en"
    values:
      lang: en
  - scope:
      path: ""
    values:
      lang: zh
