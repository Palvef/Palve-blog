url: "https://blog.palve.moe"
baseurl: ""
title: "Palve"
description: "System Administrator, Infrastructure & Security Engineer"
description_zh: "系统运维、基础设施与网络安全工程师"
repository: "Palvef/Palve-blog"
google_analytics: "G-Y7KVPN8R2K"

lang: zh-CN
timezone: "Asia/Shanghai"
permalink: /:year/:month/:slug/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE.md
  - vendor
  - node_modules
  - tmp

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "_posts/zh"
    values:
      layout: post
      lang: zh
  - scope:
      path: "_posts/en"
    values:
      layout: post
      lang: en
  - scope:
      path: "en"
    values:
      lang: en
  - scope:
      path: ""
    values:
      lang: zh
