{% assign current_lang = page.lang | default: "zh" %}
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Palve" />
    {% if page.layout == "home" %}
    <title>{{ site.title }}</title>
    {% else %}
    <title>{{ page.title }} ｜ {{ site.title }}</title>
    {% endif %}
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}" />
    <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}" />
    {% feed_meta %}

    <link rel="stylesheet" type="text/css" media="screen" href="{{ '/assets/css/normalize.css' | relative_url }}" />
    <link rel="stylesheet" type="text/css" media="screen" href="{{ '/assets/css/animate.min.css' | relative_url }}" />
    <link rel="stylesheet" type="text/css" media="screen" href="{{ '/assets/css/zozo.css' | relative_url }}" />
    <link rel="stylesheet" type="text/css" media="screen" href="{{ '/assets/css/highlight.css' | relative_url }}" />
    <link rel="stylesheet" type="text/css" media="screen" href="{{ '/assets/css/toc-pow.css' | relative_url }}" />

    {% if site.google_analytics and jekyll.environment == "production" %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}
</head>
